name: library-management

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-library}
      MYSQL_USER: ${DB_USER:-library}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      DB_TEST_NAME: ${DB_TEST_NAME:-library_test}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/docker/00-test-db.sh:/docker-entrypoint-initdb.d/00-test-db.sh:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      TRUST_PROXY: "true"
    ports:
      - "8080:80"
    # Code lives in the image (rebuild after PHP changes: docker compose up -d --build api scheduler).
    # Only data that must survive rebuilds is mounted.
    volumes:
      - covers:/var/www/html/public/uploads/covers
      - api_logs:/var/www/html/logs
      - ./database:/var/www/database:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - api_logs:/var/www/html/logs
    working_dir: /var/www/html
    # Runs the overdue/reservation-expiry job hourly (equivalent to a crontab entry).
    entrypoint: ["sh", "-c", "while true; do php bin/mark_overdue.php; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://api:80
      VITE_POLL: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  dbdata:
  web_node_modules:
  covers:
  api_logs:
